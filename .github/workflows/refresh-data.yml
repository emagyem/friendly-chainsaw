name: Refresh data

# Rebuilds public/data/companies.json from SEC EDGAR, ClinicalTrials.gov and a
# stock price feed, then commits it. Netlify rebuilds the site on each commit.

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 11:17 UTC on weekdays, after the overnight SEC index update
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab
  push:                        # also refresh when the ticker list, assumptions or script change
    branches: [main]
    paths: ["config/**", "scripts/fetch-data.mjs"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest data
        env:
          # The SEC requires a name and contact email on automated requests.
          # Set SEC_CONTACT_EMAIL under Settings → Secrets and variables → Actions → Variables.
          SEC_USER_AGENT: "Helixora research ${{ vars.SEC_CONTACT_EMAIL }}"
          # Optional. Without it, prices come from Yahoo Finance's public endpoint.
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
