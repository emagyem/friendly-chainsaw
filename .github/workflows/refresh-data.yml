name: Refresh data

# Rebuilds public/data/companies.json from SEC EDGAR, ClinicalTrials.gov and a
# stock price feed, then commits it. The host (Cloudflare Pages) rebuilds the site on each commit.

on:
  schedule:
    - cron: "17 11 * * 1-5"   # 11:17 UTC on weekdays, after the overnight SEC index update
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab
  push:                        # also refresh when the ticker list, assumptions or script change
    branches: [main]
    paths: ["config/**", "scripts/fetch-data.mjs", "scripts/offering.mjs", "scripts/insiders.mjs", "scripts/shorts.mjs", "scripts/periodic.mjs", "scripts/accounting.mjs"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Kept for the phone-app alerts, which compare today's data with the last run's.
      - name: Keep the previous data
        run: cp public/data/companies.json "$RUNNER_TEMP/previous-companies.json" || true

      - name: Fetch latest data
        env:
          # The SEC requires a name and contact email on automated requests.
          # Set SEC_CONTACT_EMAIL under Settings → Secrets and variables → Actions → Variables.
          SEC_USER_AGENT: "Helixora research ${{ vars.SEC_CONTACT_EMAIL }}"
          # Optional. Without it, prices come from Yahoo Finance's public endpoint.
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data config && [ -z "$(git ls-files --others --exclude-standard public/data)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data config
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this ran; this run's data wins any clash.
          git pull --rebase -X theirs
          git push

      # Phone-app push alerts for watched companies that changed. Skips itself until the
      # PUSH_KEY, APNS_* and FCM_SERVICE_ACCOUNT secrets are set (see scripts/push-alerts.mjs).
      - name: Send app alerts
        continue-on-error: true
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APNS_ENV: ${{ vars.APNS_ENV }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: node scripts/push-alerts.mjs "$RUNNER_TEMP/previous-companies.json" public/data/companies.json
