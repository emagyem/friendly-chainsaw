# Historical backtest of the Financing Pressure Score (scripts/backtest.mjs).
# Runs monthly and on demand; writes public/data/backtest.json.
name: Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 5 * *"

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: .cache/backtest
          key: backtest-${{ github.run_id }}
          restore-keys: backtest-
      - run: node scripts/backtest.mjs
        env:
          SEC_USER_AGENT: "Helixora research ${{ vars.SEC_CONTACT_EMAIL }}"
      - name: Commit results
        run: |
          git config user.name "helixora-bot"
          git config user.email "helixora-bot@users.noreply.github.com"
          git add public/data/backtest.json
          git diff --cached --quiet || git commit -m "Backtest results $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push -q
