name: Probe backtest sources
on:
  push:
    branches: [backtest-v1]
    paths: ["scripts/probe-backtest.mjs", ".github/workflows/probe-backtest.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/probe-backtest.mjs
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
