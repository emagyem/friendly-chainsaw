# Runs the iOS app in the iPhone Simulator and saves App Store screenshots
# (Artifacts → app-screenshots). Run it from the Actions tab whenever the app changes.
name: App screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run app:build
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Run the app and take screenshots
        run: |
          # The largest iPhone available: App Store Connect asks for 6.9-inch screenshots.
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0)).devices;
            const all = Object.entries(d).filter(([r]) => /iOS/.test(r)).flatMap(([, l]) => l);
            const pick = all.find((x) => /Pro Max/.test(x.name)) || all.find((x) => /Plus/.test(x.name)) || all.find((x) => /iPhone/.test(x.name));
            console.log(pick.udid); console.error(pick.name);')
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p shots
          curl -sS -o /dev/null -w "Host check: HTTP %{http_code}, %{size_download} bytes in %{time_total}s\n" -H "Origin: capacitor://localhost" https://helixora.pages.dev/data/companies.json || true
          # Each screen is opened by its web link (#company/SRRK and so on): the app reads the link
          # when it starts, so the bundled page is given the link before each launch.
          APP_DIR=$(xcrun simctl get_app_container "$DEVICE" com.helixora.app app)
          cp "$APP_DIR/public/index.html" "$RUNNER_TEMP/index.html"
          shoot() {
            xcrun simctl terminate "$DEVICE" com.helixora.app 2>/dev/null || true
            sed "s#<head>#<head><script>location.hash='$1'</script>#" "$RUNNER_TEMP/index.html" > "$APP_DIR/public/index.html"
            xcrun simctl launch "$DEVICE" com.helixora.app; sleep "$3"
            xcrun simctl io "$DEVICE" screenshot "shots/$2.png"
          }
          shoot "" 1-home 30
          shoot "report" 2-pressure-report 15
          shoot "company/SRRK" 3-company 15
          shoot "company/SRRK/pressure" 4-financing-pressure 15
          shoot "company/GOSS/accounting" 5-accounting 15
          shoot "company/SRRK/ownership" 6-insiders 15
          shoot "catalysts" 7-catalysts 15
          cp "$RUNNER_TEMP/index.html" "$APP_DIR/public/index.html"
          xcrun simctl spawn "$DEVICE" log show --last 5m --predicate 'process == "App"' --style compact | grep -iE "error|exception|⚡️" | tail -40 || true
      - name: Save the screenshots in the repository (store/screenshots/ios)
        run: |
          mkdir -p store/screenshots/ios && cp shots/*.png store/screenshots/ios/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots/ios
          git diff --cached --quiet || { git commit -m "App Store screenshots $(date -u +%Y-%m-%d)"; git pull --rebase -X theirs; git push; }
